  annotation: ^カ[ゴノトリニ_ミ[ズト#エ]サヲ#マ]イニチ#ヤ[ル#ヨ]ーニ#シ[テクダサ]イ$
BASIC5000_0680:
  text: お母さんは、無意識に椅子をつかんだ。
  annotation: ^オ[カ]ーサンワ_ム[イ]シキニ#イ[スヲ#ツ[カ]ンダ$
BASIC5000_0681:
  text: 武雄は受かり、邦夫は受からないと思っていたが、結果は逆だった。
  annotation: ^タ[ケオワウカ]リ_ク[ニオワ#ウ[カラ]ナイト#オ[モ]ッテ#イ[タ]ガ_ケ[ッカワ#ギャ[クダ]ッタ$
BASIC5000_0682:
  text: 鮫は、その血に飢えた残忍さで悪名高い。
  annotation: ^サ[メワ_ソ[ノ#チ[ニ#ウ]エタ#ザ[ンニンサ]デ#ア[クメーダカ]イ$
BASIC5000_0683:
  text: 着物なんて、年に一回しかきません。
  annotation: ^キ[モノナ]ンテ_ネ]ンニ#イ[ッカイ]シカ#キ[マセ]ン$
BASIC5000_0684:
