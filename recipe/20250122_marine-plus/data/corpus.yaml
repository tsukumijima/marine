  annotation: ^ヤ[セル]ニワ_カ[コクナ#ダ[ンジキヲ#シ[ナ]イト#イ[ケナ]イト#オ[モ]ッテイル#ヒ[ト$
BASIC5000_0676:
  text: 想像力は、すべての文明の根本である。
  annotation: ^ソ[ーゾ]ーリョクワ_ス]ベテノ#ブ[ンメーノ#コ[ンポンデア]ル$
BASIC5000_0677:
  text: 緑は、バイオリンが上手だというのは本当ですか。
  annotation: ^ミ]ドリワ_バ[イオリンガ#ジョ[ーズ]ダト#ユ]ーノワ#ホ[ントーデ]スカ?$
BASIC5000_0678:
  text: 緑の絨毯では、この青いカーテンと調和しないだろう。
  annotation: ^ミ]ドリノ#ジュ]ータンデワ_コ[ノ#ア[オ]イ#カ]ーテント#チョ[ーワ#シ[ナ]イダロー$
BASIC5000_0679:
