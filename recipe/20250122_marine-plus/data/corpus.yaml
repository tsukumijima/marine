  text: 一昔前だったら、駅や、レストランや、病院の待合室で、タバコに火をつけるのをためらう人はいなかっただろう。
  annotation: ^ヒ[トム]カシ#マ]エダッタラ_エ]キヤ_レ]ストランヤ_ビョ[ーインノ#マ[チア]イシツデ_タ[バコニ#ヒ]ヲ#ツ[ケ]ルノヲ#タ[メラ]ウ#ヒ[ト]ワ#イ[ナ]カッタダロー$
BASIC5000_0610:
  text: 湿気の多い気候は、その半島の特色です。
  annotation: ^シ[ッケノ#オ]ーイ#キ[コーワ_ソ[ノ#ハ[ントーノ#ト[クショクデス$
BASIC5000_0611:
  text: 実を言うと、私達は昨年結婚しました。
  annotation: ^ジ[ツ]ヲ#ユ[ート_ワ[タシ]タチワ#サ[クネン_ケ[ッコンシマシ]タ$
BASIC5000_0612:
  text: 一昨日、偶然電車の中で彼女と出会った。
  annotation: ^オ[トトイ_グ[ーゼン#デ[ンシャノナ]カデ#カ]ノジョト#デ[ア]ッタ$
BASIC5000_0613:
  text: 月曜までに、この仕事を終えてください。
  annotation: ^ゲ[ツヨ]ーマデニ_コ[ノシゴトヲ#オ[エテクダサ]イ$
BASIC5000_0614:
  text: 試してみると、アレックスは、単に物まねをしているのではないことがわかった。
  annotation: ^タ[メ]シテミルト_ア[レ]ックスワ_タ]ンニ#モ[ノマネヲ#シ[テイル]ノデワ#ナ]イコトガ#ワ[カ]ッタ$
BASIC5000_0615:
  text: 実も結ぶが、挿し木でも根付くらしい。
  annotation: ^ミ[モ#ム[スブ]ガ_サ[シギデ]モ#ネ[ズクラシ]イ$
BASIC5000_0616:
  text: 翌年、第一次世界大戦が始まりました。
  annotation: ^ヨ[クネン_ダ]イイチジ#セ[カイタ]イセンガ#ハ[ジマリマ]シタ$
BASIC5000_0617:
  text: 唯一、人生に意味を与えてくれるような芸術作品の中に、美しい人生と言うものも含めて考える事によって、私は、後にこの途方もない考えを修正したのだが、それでも、私が尊重していたのは、やはり美であった。
  annotation: ^ユ[イ]ツ_ジ]ンセーニ#イ]ミヲ#ア[タエテクレル#ヨ]ーナ#ゲ[ージュツサ]クヒンノ#ナ[カ]ニ_ウ[ツクシ]ー#ジ]ンセート#ユ[ーモノ]モ#フ[ク]メテ#カ[ンガエ]ル#コ[ト]ニヨッテ_ワ[タシワ_ノ[チ]ニ#コ[ノ#ト[ホーモナ]イ#カ[ンガ]エヲ#シュ[ーセーシタ]ノダガ_ソ[レデ]モ_ワ[タシガ#ソ[ンチョーシテイタ]ノワ_ヤ[ハ]リ#ビ]デアッタ$
BASIC5000_0618:
  text: 明言はしなかったが、彼は、私が嘘をついていると、暗にほのめかした。
  annotation: ^メ[ーゲ]ンワ#シ[ナ]カッタガ_カ]レワ_ワ[タシガ#ウ]ソヲ#ツ]イテ#イ[ル]ト_ア]ンニ#ホ[ノメカ]シタ$
BASIC5000_0619:
  text: 乙が受託業務の実施により得た成果は、甲乙双方に帰属するものとする。
  annotation: ^オ]ツガ#ジュ[タクギョ]ームノ#ジ[ッシニヨ]リ#エ]タ#セ]ーカワ_コ]ーオツ#ソ[ーホーニ#キ[ゾクスル#モ[ノ]トスル$
BASIC5000_0620:
  text: 仙台へ行って、とんぼ返りで帰ってきました。
  annotation: ^セ]ンダイエ#イ[ッテ_ト[ンボガ]エリデ#カ]エッテキマシタ$
BASIC5000_0621:
  text: 私、今日はとっても幸せな気分なの。
  annotation: ^ワ[タシ_キョ]ーワ#ト[ッテモ#シ[アワセナ#キ]ブン#ナ]ノ$
BASIC5000_0622:
  text: 岩石や鉱物は、いろいろな面で私たちに有益である。
  annotation: ^ガ]ンセキヤ#コ]ーブツワ_イ[ロイロナ#メ]ンデ#ワ[タシ]タチニ#ユ[ーエキデア]ル$
BASIC5000_0623:
  text: 王を得た麒麟もまた、寿命を持たない生き物だが、この病ばかりは、治療の方法がない。
  annotation: ^オ]ーヲエタ#キ[リンモマタ_ジュ[ミョーヲ#モ[タ]ナイ#イ[キ]モノダガ_コ[ノ#ヤ]マイ#バ]カリワ_チ[リョーノホーホーガナ]イ$
BASIC5000_0624:
  text: 歩行中に、かばんから目を離さないように。
  annotation: ^ホ[コーチューニ_カ[バンカラ#メ]ヲ#ハ[ナサ]ナイヨーニ$
BASIC5000_0625:
  text: 気宇壮大な計画もいいけれど、まずは自分の足元を固めることから始めてほしいよ。
  annotation: ^キ]ウ#ソ[ーダイナ#ケ[ーカクモ#イ]ーケレド_マ]ズワ#ジ[ブンノ#ア[シモ]トヲ#カ[タメルコト]カラ#ハ[ジメテ#ホ[シ]ーヨ$
BASIC5000_0626:
  text: 偉人というものは、若い頃に苦労した人が多い。
  annotation: ^イ[ジントユーモ]ノワ_ワ[カ]イコロニ#ク]ローシタ#ヒ[ト]ガ#オ]ーイ$
BASIC5000_0627:
  text: 朝早く人を訪問するのは、礼儀に反する。
  annotation: ^ア]サ#ハ]ヤク#ヒ[トヲ#ホ[ーモンスル]ノワ_レ[ーギ]ニ#ハ[ンス]ル$
BASIC5000_0628:
  text: 都心では、高層ビルが、雨後のたけのこのように増えている。
  annotation: ^ト[シンデ]ワ_コ[ーソービ]ルガ_ウ]ゴノ#タ[ケノコノ#ヨ]ーニ#フ]エテイル$
BASIC5000_0629:
  text: 朝日新聞には、そのニュースは載っていない。
  annotation: ^ア[サヒシ]ンブンニワ_ソ[ノ#ニュ]ースワ#ノ[ッテイナイ$
BASIC5000_0630:
  text: 私望んでた地位を手に入れることができなかった。
  annotation: ^ワ[タシ#ノ[ゾンデ]タ#チ]ーヲ#テ]ニイレル#コ[ト]ガ#デ[キナ]カッタ$
BASIC5000_0631:
  text: 卵を落とさないように気をつけなさい。
  annotation: ^タ[マ]ゴヲ#オ[トサ]ナイ#ヨ]ーニ#キ[ヲツケナサ]イ$
BASIC5000_0632:
  text: 私服警官が、始終大統領の身辺を固めていた。
  annotation: ^シ[フクケ]ーカンガ_シ]ジュー#ダ[イト]ーリョーノ#シ]ンペンヲ#カ[タメテイタ$
BASIC5000_0633:
  text: 夏場の東京は、台風に見舞われやすい。
  annotation: ^ナ[ツバノトーキョーワ_タ[イフ]ーニ#ミ[マワレヤス]イ$
BASIC5000_0634:
  text: 受付で、入院の手続きをしてください。
  annotation: ^ウ[ケツケデ_ニュ[ーインノ#テ[ツズキ]ヲ#シ[テクダサ]イ$
BASIC5000_0635:
  text: 生物学者は、損失は深刻だと主張している。
  annotation: ^セ[ーブツガ]クシャワ_ソ[ンシツワ#シ[ンコクダ]ト#シュ[チョーシテイル$
BASIC5000_0636:
  text: 新聞によれば、東京が世界でもっとも生活費が高いそうだ。
  annotation: ^シ[ンブンニヨレ]バ_ト[ーキョーガ#セ]カイデ#モ[ット]モ#セ[ーカツ]ヒガ#タ[カ]イソーダ$
BASIC5000_0637:
  text: 目をとじるか閉じないうちに、私は眠ってしまった。
  annotation: ^メ]ヲ#ト[ジ]ルカ#ト[ジ]ナイウチニ_ワ[タシワ#ネ[ムッテ#シ[マッタ$
BASIC5000_0638:
  text: 中央線においでのお客様は、次の駅でお乗り換えください。
  annotation: ^チュ[ーオーセンニオイデノオキャクサマ]ワ_ツ[ギ]ノ#エ]キデ#オ[ノリカエクダサ]イ$
BASIC5000_0639:
  text: すらすら言えるようになるまで、この文を暗記しなさい。
  annotation: ^ス]ラスラ#イ[エル#ヨ]ーニ#ナ]ルマデ_コ[ノ#ブ]ンヲ#ア[ンキシナサ]イ$
BASIC5000_0640:
  text: すり減らすのはシーツではなく靴にしろ。
  annotation: ^ス[リヘラ]スノワ#シ]ーツデワ#ナ]ク#ク[ツ]ニシロ$
BASIC5000_0641:
  text: するとサルは、小さなブリキのコップを持って、歩き回りました。
  annotation: ^ス[ルト#サ]ルワ_チ]ーサナ#ブ[リキノコップヲモ]ッテ_ア[ルキマワリマ]シタ$
BASIC5000_0642:
  text: すんばらしい妻だし、すんばらしい母親だ。
  annotation: ^ス[ンバラシ]ー#ツ]マダシ_ス[ンバラシ]ー#ハ[ハオヤダ$
BASIC5000_0643:
  text: 寝ようとしたところへ、彼から電話がかかってきた。
  annotation: ^ネ[ヨート#シ[タトコロ]エ_カ]レカラ#デ[ンワガ#カ[カ]ッテキタ$
BASIC5000_0644:
  text: 寝る前に、明かりを消すのを忘れないように。
  annotation: ^ネ[ルマ]エニ_ア[カリヲ#ケ[ス]ノヲ#ワ[スレナイヨ]ーニ$
BASIC5000_0645:
  text: 空港まで、どのくらいかかると思いますか。
  annotation: ^ク[ーコーマ]デ_ド[ノクライ#カ[カ]ルト#オ[モイマ]スカ?$
BASIC5000_0646:
  text: 仲介役がしっかりしていると、取り引きがスムーズに行く。
  annotation: ^チュ[ーカイヤクガ#シ[ッカ]リ#シ[テイルト_ト[リ]ヒキガ#ス[ム]ーズニ#イ[ク$
BASIC5000_0647:
  text: 小雨のときは、傘は役に立つが、土砂降りのときは、ほとんど役に立たない。
  annotation: ^コ[サメノト]キワ_カ]サワ#ヤ[ク]ニタツガ_ド[シャブリノト]キワ_ホ[ト]ンド#ヤ[ク]ニ#タ[タ]ナイ$
BASIC5000_0648:
  text: 手もとにあるどのような武器を用いても、エイズと闘う必要がある。
  annotation: ^テ[モト]ニ#ア]ル#ド]ノヨーナ#ブ]キヲ#モ[チ]ーテモ_エ]イズト#タ[タカウ#ヒ[ツヨーガア]ル$
BASIC5000_0649:
  text: 病院の後ろにある、あの建物はなんですか。
  annotation: ^ビョ[ーインノウシロニア]ル_ア[ノ#タ[テ]モノワ#ナ]ンデスカ?$
BASIC5000_0650:
  text: 手を洗ってしまったら、ここへおいで。
  annotation: ^テ]ヲ#ア[ラッテシマッタ]ラ_コ[コエ#オ[イデ?$
BASIC5000_0651:
  text: 永続的な家をもたなかったから、食糧のための作物を栽培することがなかった。
  annotation: ^エ[ーゾクテキナ_イ[エ]ヲ#モ[タ]ナカッタカラ_ショ[クリョ]ーノタメノ#サ[ク]モツヲ#サ[イバイスルコト]ガ#ナ]カッタ$
BASIC5000_0652:
  text: 電灯の発明は、エジソンによるとされている。
  annotation: ^デ[ントーノハツメーワ_エ]ジソンニ#ヨ[ル]ト#サ[レテイル$
BASIC5000_0653:
  text: 悲劇の本質は、短編小説のそれと同じように、その、葛藤である。
  annotation: ^ヒ]ゲキノ#ホ[ンシツワ_タ[ンペンショ]ーセツノ#ソ[レト#オ[ナジ#ヨ]ーニ_ソ[ノ_カ[ットーデア]ル$
BASIC5000_0654:
  text: 暗黒のおうじとは、悪魔のことである。
  annotation: ^ア[ンコクノオ]ージトワ_ア]クマノ#コ[ト]デ#ア]ル$
BASIC5000_0655:
  text: しょっちゅう鼻をかんでいなければなりません。
  annotation: ^ショ]ッチュー#ハ[ナヲ#カ]ンデ#イ[ナ]ケレバ#ナ[リマセ]ン$
BASIC5000_0656:
  text: 赤ん坊が浴槽の中で、ぼちゃぼちゃやっていた。
  annotation: ^ア[カンボーガ#ヨ[クソーノナ]カデ_ボ]チャボチャ#ヤ[ッテイタ$
BASIC5000_0657:
  text: １分だって、ほぼ４ポンドかかるんだから。
  annotation: ^イ]ップンダッテ_ホ]ボ#ヨ[ンポ]ンド#カ[カ]ルンダカラ$
BASIC5000_0658:
  text: 国民総生産は、一国の財と、サービスを貨幣価値で測った、総生産高である。
  annotation: ^コ[クミンソーセ]ーサンワ_イ[ッコク]ノ#ザ]イト_サ]ービスヲ#カ[ヘーカ]チデ#ハ[カ]ッタ_ソ[ー#セ[ーサンダカデア]ル$
BASIC5000_0659:
  text: 砂浜で、いろんな貝を拾うのは、実に楽しい。
  annotation: ^ス[ナハマデ_イ[ロンナ#カ]イヲ#ヒ[ロウ]ノワ_ジ[ツ]ニ#タ[ノシ]ー$
BASIC5000_0660:
  text: 宙返りするジェットコースターに乗ったら、気持ち悪くなっちゃった。
  annotation: ^チュ[ーガ]エリスル#ジェ[ットコ]ースターニ#ノ[ッタ]ラ_キ[モチワ]ルク#ナ]ッチャッタ$
BASIC5000_0661:
  text: 星占いによると、彼女と僕は、あまり相性がよくないようだ。
  annotation: ^ホ[シウ]ラナイニヨルト_カ]ノジョト#ボ]クワ_ア[マリ#ア[イショ]ーガ#ヨ]クナイ#ヨ]ーダ$
BASIC5000_0662:
  text: 眼は、手を見極め得るが、心までは見極め得ない。
  annotation: ^メ]ワ_テ]ヲ#ミ[キワメエ]ルガ_コ[コロ]マデワ#ミ[キワメエ]ナイ$
BASIC5000_0663:
  text: 波が、そのボートを飲み込んでしまった。
  annotation: ^ナ[ミ]ガ_ソ[ノ#ボ]ートヲ#ノ[ミコ]ンデシマッタ$
BASIC5000_0664:
  text: 天然資源は、無限に存在するわけではない。
  annotation: ^テ[ンネンシ]ゲンワ_ム[ゲンニ#ソ[ンザイスルワ]ケデワ#ナ]イ$
BASIC5000_0665:
  text: 副社長によると、会社は、いまだに外国の会社から、契約をもらっていない。
  annotation: ^フ[クシャ]チョーニヨルト_カ[イシャワ_イ[マダニ#ガ[イコクノカイシャカラ_ケ[ーヤクヲ#モ[ラッテイナイ$
BASIC5000_0666:
  text: 戦争が、国の資源と労働力を使い果たしてしまった。
  annotation: ^セ[ンソーガ_ク[ニノシ]ゲント#ロ[ード]ーリョクヲ#ツ[カイハタ]シテシマッタ$
BASIC5000_0667:
  text: 波の音の他は、何一つ聞こえなかった。
  annotation: ^ナ[ミノ#オ[ト]ノ#ホ[カワ_ナ]ニ#ヒ[ト]ツ#キ[コエナ]カッタ$
BASIC5000_0668:
  text: 物価は安くなるどころか、高くなるばかりだった。
  annotation: ^ブ]ッカワ#ヤ[ス]クナル#ド[コロ]カ_タ]カクナル#バ]カリダッタ$
BASIC5000_0669:
  text: 無断でそこに駐車してはいけません。
  annotation: ^ム[ダンデソコニ#チュ[ーシャ#シ[テ]ワ#イ[ケマセ]ン$
BASIC5000_0670:
  text: 町をあげて来訪者を心から歓迎した。
  annotation: ^マ[チ]ヲ#ア[ゲテ#ラ[イホ]ーシャヲ#コ[コロ]カラ#カ[ンゲーシタ$
BASIC5000_0671:
  text: 読みたいと思う本を、どれでもお取り下さい。
  annotation: ^ヨ[ミタ]イト#オ[モ]ウ#ホ]ンヲ_ド]レデモ#オ[トリクダサ]イ$
BASIC5000_0672:
  text: 基本ルールを学んでしまえば、そのゲームは簡単です。
  annotation: ^キ[ホンル]ールヲ#マ[ナンデシマエ]バ_ソ[ノ#ゲ]ームワ#カ[ンタンデス$
BASIC5000_0673:
  text: 超特急のぞみは、ひかりより速く走る。
  annotation: ^チョ]ートッキュー#ノ[ゾミワ_ヒ[カリヨ]リ#ハ[ヤ]ク#ハ[シ]ル$
BASIC5000_0674:
  text: 始めは、それを簡単な事だと思いました。
  annotation: ^ハ[ジメワ_ソ[レヲ#カ[ンタンナ#コ[ト]ダト#オ[モイマ]シタ$
BASIC5000_0675:
