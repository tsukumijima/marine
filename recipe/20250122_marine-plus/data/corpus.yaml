  text: 彼女は、恥じらいの色を隠すために、顔をそむけた。
  annotation: ^カ]ノジョワ_ハ[ジライノ#イ[ロ]ヲ#カ[ク]スタメニ_カ[オヲ#ソ[ム]ケタ$
BASIC5000_4901:
  text: 彼女は私を見るや否や、わっと泣き出した。
  annotation: ^カ]ノジョワ#ワ[タシヲ#ミ]ルヤ#イ]ナヤ_ワ]ット#ナ[キダ]シタ$
BASIC5000_4902:
  text: 彼女は三味線による、新しいジャズの演奏法を始めた。
  annotation: ^カ]ノジョワ#シャ[ミセンニヨル_ア[タラシ]ー#ジャ]ズノ#エ[ンソーホーヲ#ハ[ジメタ$
BASIC5000_4903:
  text: 彼女はいつも、床を綺麗に掃いています。
  annotation: ^カ]ノジョワ#イ]ツモ_ユ[カヲ#キ]レーニ#ハ]イテイマス$
BASIC5000_4904:
  text: 彼女の伯母は、一日中、彼の犬の世話をする。
  annotation: ^カ]ノジョノ#オ[バワ_イ[チニチジュー_カ]レノ#イ[ヌノ#セ[ワ]ヲスル$
BASIC5000_4905:
  text: 彼女のいうことは、的外れである。
  annotation: ^カ]ノジョノ#ユ[ーコト]ワ_マ[トハ]ズレデアル$
BASIC5000_4906:
  text: 彼女がこれほど自分勝手なのは嘆かわしい。
  annotation: ^カ]ノジョガ#コ[レホド#ジ[ブンカ]ッテナノワ#ナ[ゲカワシ]ー$
BASIC5000_4907:
  text: 彼は、緻密に立てた計画を実行した。
  annotation: ^カ]レワ_チ[ミツニ#タ]テタ#ケ[ーカクヲ#ジ[ッコーシタ$
BASIC5000_4908:
  text: 彼は老けて見える。
  annotation: ^カ]レワ#フ]ケテ#ミ[エ]ル$
BASIC5000_4909:
  text: 彼は、大尉以上の者を全員招集した。
  annotation: ^カ]レワ_タ[イイイ]ジョーノ#モ[ノ]ヲ_ゼ[ンイン#ショ[ーシューシタ$
BASIC5000_4910:
  text: 彼は、尻尾を巻いて逃げた。
  annotation: ^カ]レワ_シ[ッポ]ヲ#マ[イテ#ニ]ゲタ$
BASIC5000_4911:
  text: 彼は、重大な使命を任された。
  annotation: ^カ]レワ_ジュ[ーダイナ#シ]メーヲ#マ[カサ]レタ$
BASIC5000_4912:
  text: 彼は、二十世紀最高のピアニストだと言って、差し支えないでしょう。
  annotation: ^カ]レワ_ニ[ジュッセ]ーキ#サ[イコーノ#ピ[アニ]ストダト#イ[ッテ_サ[シツカエ#ナ]イデショウ$
BASIC5000_4913:
  text: 彼は玄人にちかい。
  annotation: ^カ]レワ#ク[ロ]ートニ#チ[カ]イ$
BASIC5000_4914:
  text: 彼は、結婚に対して煮えきらない態度を取るの。
  annotation: ^カ]レワ_ケ[ッコンニ#タ]イシテ#ニ[エキラ]ナイ#タ]イドヲ#ト]ルノ$
BASIC5000_4915:
  text: 彼は、競争相手を落とし入れようと、虎視眈々としている。
  annotation: ^カ]レワ_キョ[ーソーア]イテヲ#オ[トシイレヨ]ート_コ]シ#タ[ンタント#シ[テイル$
BASIC5000_4916:
  text: 彼は、丘を転げるようにやってきた。
  annotation: ^カ]レワ_オ[カヲ#コ[ロゲルヨ]ーニ#ヤ[ッテキ]タ$
BASIC5000_4917:
  text: 彼は、過って親指を、金槌で打ち付けた。
  annotation: ^カ]レワ_ア[ヤマ]ッテ#オ[ヤユビヲ_カ[ナズ]チデ#ウ[チツ]ケタ$
BASIC5000_4918:
  text: 彼は、井戸を飲み干すほど、のどが渇いていた。
  annotation: ^カ]レワ_イ]ドヲ#ノ[ミホ]スホド_ノ]ドガ#カ[ワ]イテイタ$
BASIC5000_4919:
  text: 彼は、とてもその仕事が勤まらなかった。
  annotation: ^カ]レワ_ト[テモ#ソ[ノ#シ[ゴトガ#ツ[トマラナ]カッタ$
BASIC5000_4920:
  text: 彼は、その話を聞いて仰天した。
  annotation: ^カ]レワ_ソ[ノ#ハ[ナシ]ヲ#キ[ーテ#ギョ[ーテンシタ$
BASIC5000_4921:
  text: 彼は６月に東京を離れて、関西に来る。
  annotation: ^カ]レワ#ロ[クガツ]ニ#ト[ーキョーヲ#ハ[ナ]レテ_カ]ンサイニ#ク]ル$
BASIC5000_4922:
  text: 彼が仮病を使ったのは、あきらかだ。
  annotation: ^カ]レガ#ケ[ビョーヲ#ツ[カッタ]ノワ_ア[キ]ラカダ$
BASIC5000_4923:
  text: 彼、今日、精彩がないね、青菜に塩だね。
  annotation: ^カ]レ_キョ]ー_セ[ーサイガ#ナ]イネ_ア[オナニ#シ[オ]ダネ$
BASIC5000_4924:
  text: 濃霧の為、彼の前を歩いて行く男の姿が、やがて見えなくなった。
  annotation: ^ノ]ームノ#タ[メ_カ]レノ#マ]エヲ#ア[ル]イテイク#オ[トコノ#ス]ガタガ_ヤ[ガテ#ミ[エ]ナクナッタ$
BASIC5000_4925:
  text: 乳母車で眠っている赤ちゃんは、天使のようにかわいい。
  annotation: ^ウ[バグ]ルマデ#ネ[ムッテイル#ア]カチャンワ_テ]ンシノヨーニ#カ[ワイ]ー$
BASIC5000_4926:
  text: 日本は、四つの主な島から成り立っている。
  annotation: ^ニ[ホ]ンワ_ヨ[ッツ]ノ#オ]モナ#シ[マ]カラ#ナ[リタ]ッテイル$
BASIC5000_4927:
  text: 日本の最高峰は、富士山である。
  annotation: ^ニ[ホンノ#サ[イコ]ーホーワ_フ]ジサンデ#ア]ル$
BASIC5000_4928:
  text: 日本の牛は、広範囲に霜降りがある。
  annotation: ^ニ[ッポンノ#ウ[シワ_コ[ーハ]ンイニ#シ[モフリガ#ア]ル$
BASIC5000_4929:
  text: 尼僧は、お祈りをして十字を切った。
  annotation: ^ニ]ソーワ_オ[イノリヲシテ#ジュ[ージヲ#キ]ッタ$
BASIC5000_4930:
  text: 二つの建物は隣りあっている。
  annotation: ^フ[タツ]ノ#タ[テモ]ノワ#ト[ナリア]ッテイル$
BASIC5000_4931:
  text: 突然の彼の訃報は、私を驚かせた。
  annotation: ^ト[ツゼンノ#カ]レノ#フ[ホーワ_ワ[タシヲ#オ[ドロカ]セタ$
BASIC5000_4932:
  text: 東京には、醜悪な建物がたくさん見られる。
  annotation: ^ト[ーキョーニ]ワ_シュ]ーアクナ#タ[テモ]ノガ#タ[クサン#ミ[ラレ]ル$
BASIC5000_4933:
  text: 天才は、１パーセントが霊感であり、９９パーセントは精進である。
  annotation: ^テ[ンサイワ_イ[チパーセ]ントガ_レ[ーカンデア]リ_キュ]ージュー#キュ[ーパーセ]ントワ_ショ]ージンデ#ア]ル$
BASIC5000_4934:
  text: 泥棒仲間にも、仁義がある。
  annotation: ^ド[ロボーナ]カマニモ_ジ]ンギガ#ア]ル$
BASIC5000_4935:
  text: 庭には、薔薇の花が香っている。
  annotation: ^ニ[ワニ]ワ_バ[ラノ#ハ[ナガ#カ[オッテイル$
BASIC5000_4936:
  text: ツバサは両翼を広げた。
  annotation: ^ツ[バサワ_リョ[ーヨクヲ#ヒ[ロゲタ$
BASIC5000_4937:
  text: 長年の習慣は、なかなか改まらない。
  annotation: ^ナ[ガネンノ#シュ[ーカンワ_ナ[カナカ#ア[ラタマラ]ナイ$
BASIC5000_4938:
  text: 中国では、旧暦にしたがって、正月を祝う。
  annotation: ^チュ]ーゴクデワ_キュ[ーレキニ#シ[タガッテ_ショ[ーガツ]ヲ#イ[ワ]ウ$
BASIC5000_4939:
  text: 暖かい天候の時は、発汗作用が体温の調節をする上で、役立つ。
  annotation: ^ア[タタカ]イ#テ[ンコーノ#ト[キ]ワ_ハ[ッカンサ]ヨーガ#タ]イオンノ#チョ[ーセツヲ#ス[ルウエ]デ_ヤ[クダ]ツ$
BASIC5000_4940:
  text: 大統領選挙で誰が勝つであろうかと、すべての人々が、固唾を飲んで見守った。
  annotation: ^ダ[イトーリョーセ]ンキョデ#ダ]レガ#カ]ツデ#ア[ロ]ーカト_ス]ベテノ#ヒ[ト]ビトガ_カ[タズヲ#ノ]ンデ#ミ[マモッタ$
BASIC5000_4941:
  text: 待てば、海路の、日和あり。
  annotation: ^マ]テバ_カ]イロノ_ヒ[ヨリア]リ$
BASIC5000_4942:
  text: 多くの若人がその戦争中、民主主義のために死んだ。
  annotation: ^オ]ークノ#ワ[コ]ードガ_ソ[ノ#セ[ンソーチュー_ミ[ンシュシュ]ギノ#タ[メ]ニ#シ[ンダ$
BASIC5000_4943:
  text: 善き教師になるためには、自分の生徒たちが持っている能力を最大限生かしてやることを知らなければならない。
  annotation: ^ヨ]キ#キョ]ーシニ#ナ]ル#タ[メ]ニワ_ジ[ブンノ#セ]ートタチガ#モ]ッテイル#ノ]ーリョクヲ_サ[イダ]イゲン#イ[カ]シテヤルコトヲ#シ[ラナ]ケレバ#ナ[ラ]ナイ$
BASIC5000_4944:
  text: 雪崩で道路がふさがった。
  annotation: ^ナ[ダレデ#ド]ーロガ#フ[サガッタ$
BASIC5000_4945:
  text: 青白い彼の顔が、興奮で赤らんだ。
  annotation: ^ア[オジロ]イ#カ]レノ#カ[オガ_コ[ーフンデ#ア[カラ]ンダ$
BASIC5000_4946:
  text: 森の近くに、一軒家がある。
  annotation: ^モ[リノ#チ]カクニ_イ[ッケ]ンヤガ#ア]ル$
BASIC5000_4947:
  text: 食事の最中に、呼び鈴が鳴った。
  annotation: ^ショ[クジノ#サ]イチューニ_ヨ[ビリンガ#ナ[ッタ$
BASIC5000_4948:
  text: 暑さも寒さも彼岸まで。
  annotation: ^ア]ツサモ#サ]ムサモ#ヒ[ガンマ]デ$
BASIC5000_4949:
  text: 春になれば、花が甘く咲き匂う。
  annotation: ^ハ]ルニナレバ_ハ[ナガ_ア[マク#サ[キニオ]ウ$
BASIC5000_4950:
  text: 秋風が立ち初める。
  annotation: ^ア[キカ]ゼガ#タ[チソメ]ル$
BASIC5000_4951:
  text: 若い人たちは、戦禍というものを、頭でしか知らない。
  annotation: ^ワ[カ]イ#ヒ[ト]タチワ_セ]ンカト#ユ[ーモノ]ヲ_ア[タマ]デシカ#シ[ラナイ$
BASIC5000_4952:
  text: 天皇は、在位中は、今上天皇と呼ぶ。
  annotation: ^テ[ンノ]ーワ_ザ[イイチューワ_ギ[ンジョーテンノ]ート#ヨ[ブ$
BASIC5000_4953:
  text: 時がたつにつれて、悲しみは薄らぐ。
  annotation: ^ト[キ]ガ#タ]ツニ#ツ[レテ_カ[ナシミワ#ウ[スラ]グ$
BASIC5000_4954:
  text: 私は冷静でいようとしたが、とうとう堪忍袋の緒が切れた。
  annotation: ^ワ[タシワ#レ[ーセーデ#イ[ヨ]ート#シ[タ]ガ_ト]ートー#カ[ンニンブ]クロノ#オ]ガ#キ]レタ$
BASIC5000_4955:
  text: 私は、八百屋の外で彼に出会った。
  annotation: ^ワ[タシワ_ヤ[オヤノ#ソ]トデ#カ]レニ#デ[ア]ッタ$
BASIC5000_4956:
  text: 私には、彼のうそが見破れなかった。
  annotation: ^ワ[タシニ]ワ_カ]レノ#ウ]ソガ#ミ[ヤブレナ]カッタ$
BASIC5000_4957:
  text: 私たちは、川下にある橋を渡って、回り道をしなければならなかった。
  annotation: ^ワ[タ]シタチワ_カ[ワシモニア]ル#ハ[シ]ヲ#ワ[タッテ_マ[ワリ]ミチヲ#シ[ナ]ケレバ#ナ[ラ]ナカッタ$
BASIC5000_4958:
  text: 私たちは、岐阜に行った。
  annotation: ^ワ[タ]シタチワ_ギ[フニ#イ[ッタ$
BASIC5000_4959:
  text: 子孫にきれいな、緑の地球を残したい。
  annotation: ^シ]ソンニ#キ]レーナ_ミ]ドリノ#チ[キューヲ#ノ[コシタ]イ$
BASIC5000_4960:
  text: 才子多病、佳人薄命。
  annotation: ^サ]イシ#タ[ビョー_カ[ジン#ハ[クメー$
BASIC5000_4961:
  text: 今朝起きてみると、山の頂が、雪におおわれていた。
  annotation: ^ケ]サ#オ]キテミルト_ヤ[マノ#イ[タダキガ_ユ[キ]ニ#オ[ーワレテイタ$
BASIC5000_4962:
  text: 港を見下ろす墓に、墓碑を立てた。
  annotation: ^ミ[ナトヲ#ミ[オロ]ス#ハ[カ]ニ_ボ]ヒヲ#タ]テタ$
BASIC5000_4963:
  text: このところ日照り続きで、池の水も干る可能性がでてきた。
  annotation: ^コ[ノトコロ#ヒ[デリツ]ズキデ_イ[ケノ#ミ[ズモ#ヒ]ル#カ[ノーセーガ#デ]テキタ$
BASIC5000_4964:
  text: 喧嘩をしていた二人の子供は、お互いにしかめっ面をして座っていた。
  annotation: ^ケ[ンカヲ#シ[テイ]タ#フ[タリ]ノ#コ[ドモワ_オ[タガイニ#シ[カメッツラヲシテ#ス[ワッテイタ$
BASIC5000_4965:
  text: 君の言っていることは机上の空論にすぎないよ。
  annotation: ^キ[ミノ#イ[ッテイルコト]ワ_キ[ジョーノ#ク[ーロンニ#ス[ギ]ナイヨ$
BASIC5000_4966:
  text: 我々のチームは、強力なライバルと競った。
  annotation: ^ワ[レワレノ#チ]ームワ_キョ[ーリョクナ#ラ]イバルト#キ[ソ]ッタ$
BASIC5000_4967:
  text: 雨が降ると、必ず屋根から雨水が漏る。
  annotation: ^ア]メガ#フ]ルト_カ[ナラズ#ヤ]ネカラ#ア[マ]ミズガ#モ]ル$
BASIC5000_4968:
  text: 一言居士。
  annotation: ^イ[チゲンコ]ジ$
BASIC5000_4969:
  text: もっと単刀直入に言ってくれないかな、隔靴掻痒の感なきにしもあらずだよ。
  annotation: ^モ]ット#タ[ントーチョクニューニ#イ[ッテクレナ]イカナ_カ]ッカ#ソ[ーヨーノカ]ン#ナ]キニシモ#ア]ラズダヨ$
BASIC5000_4970:
  text: パーマをかけたので、髪の毛が縮れています。
  annotation: ^パ]ーマヲ#カ]ケタノデ_カ[ミノ]ケガ#チ[ジレテイマ]ス$
BASIC5000_4971:
  text: どこで邦貨をドルに変えられるか。
  annotation: ^ド]コデ#ホ]ーカヲ#ド]ルニ#カ[エラレル]カ$
BASIC5000_4972:
  text: とうとう子供たちは山の真ん中に、りんごの木が植わっている、小さな果樹園を見つけました。
  annotation: ^ト]ートー#コ[ドモ]タチワ#ヤ[マノ#マ[ンナカニ_リ[ンゴノ#キ]ガ#ウ[ワッテイル_チ]ーサナ#カ[ジュ]エンヲ#ミ[ツケマ]シタ$
BASIC5000_4973:
  text: タバコで煙った空気を部屋から出して、新鮮な空気を入れてちょうだい。
  annotation: ^タ[バコデ#ケ[ム]ッタ#ク]ーキヲ#ヘ[ヤ]カラ#ダ]シテ_シ[ンセンナ#ク]ーキヲ#イ[レテチョーダイ$
BASIC5000_4974:
  text: それがいつだったか、日を繰って確かめた。
  annotation: ^ソ[レガ#イ]ツダッタカ_ヒ[ヲ]クッテ#タ[シカ]メタ$
BASIC5000_4975:
  text: その夜我々は、大エビに舌鼓を打った。
  annotation: ^ソ[ノ#ヨ]ル#ワ[レワレワ_オ[ーエビニ#シ[タツ]ズミヲ#ウ]ッタ$
BASIC5000_4976:
  text: その新聞は、彼の犯罪への掛かり合いを主張した。
  annotation: ^ソ[ノ#シ[ンブンワ_カ]レノ#ハ[ンザイエ]ノ#カ[カリアイヲ#シュ[チョーシタ$
BASIC5000_4977:
  text: その支払いは、２年間繰り延べられる。
  annotation: ^ソ[ノ#シ[ハライワ_ニ[ネ]ンカン#ク[リノベラレ]ル$
BASIC5000_4978:
  text: その山を、私たちは剣岳と呼ぶ。
  annotation: ^ソ[ノ#ヤ[マ]ヲ_ワ[タ]シタチワ#ツ[ルギ]ダケト#ヨ[ブ$
BASIC5000_4979:
  text: その国では、日本製品を排斥する運動が起こっていた。
  annotation: ^ソ[ノ#ク[ニ]デワ_ニ[ホンセ]ーヒンヲ#ハ[イセキスル#ウ[ンドーガ#オ[コ]ッテイタ$
BASIC5000_4980:
  text: そのボートは、波止場につながれていた。
  annotation: ^ソ[ノ#ボ]ートワ_ハ[トバニ#ツ[ナガレテイタ$
BASIC5000_4981:
  text: この本は、興味津々たるものがあって飽きない。
  annotation: ^コ[ノ#ホ]ンワ_キョ]ーミ#シ[ンシンタ]ルモノガ#ア]ッテ#ア[キ]ナイ$
BASIC5000_4982:
  text: この川には、雑魚がたくさんいる。
  annotation: ^コ[ノ#カ[ワ]ニワ_ザ]コガ#タ[クサンイル$
BASIC5000_4983:
  text: このスキャンダルで、一部の高官が、罷免される可能性がある。
  annotation: ^コ[ノ#ス[キャ]ンダルデ_イ[チ]ブノ#コ[ーカンガ_ヒ[メンサレル#カ[ノーセイガ#ア]ル$
BASIC5000_4984:
  text: ここへ来ると、いつも心が休まります。
  annotation: ^コ[コエ#ク]ルト_イ]ツモ#コ[コロ]ガ#ヤ[スマリマ]ス$
BASIC5000_4985:
  text: カレーのルーは、非常に滋養に富んでいる。
  annotation: ^カ[レーノ#ル]ーワ_ヒ[ジョーニ#ジ[ヨーニ#ト]ンデイル$
BASIC5000_4986:
  text: 自分用のベッドに寝かされる。
  annotation: ^ジ[ブンヨーノ#ベ]ッドニ#ネ[カサレル$
BASIC5000_4987:
  text: あなたの寄附は、小児病院を建設する補助として、大いに役立つでしょう。
  annotation: ^ア[ナ]タノ#キ]フワ_ショ[ーニビョ]ーインヲ#ケ[ンセツスル#ホ]ジョトシテ_オ]ーイニ#ヤ[クダ]ツデショー$
BASIC5000_4988:
  text: あいつら酔い潰れちゃった。
  annotation: ^ア[イツ]ラ#ヨ[イツブ]レチャッタ$
BASIC5000_4989:
  text: 小林勇は、幸せだ。
  annotation: ^コ[バヤシ#イ[サムワ_シ[アワセダ$
BASIC5000_4990:
  text: 意気地が、なかったんだ。
  annotation: ^イ]クジガ_ナ]カッタンダ$
BASIC5000_4991:
  text: 最近、気分が萎え気味だ。
  annotation: ^サ[イキン_キ]ブンガ#ナ[エギミダ$
BASIC5000_4992:
  text: 虚無僧が托鉢している様子を眺める。
  annotation: ^コ[ム]ソーガ#タ[クハツシテイル#ヨ[ースヲ#ナ[ガメ]ル$
BASIC5000_4993:
  text: 慰安旅行を、明日に控える。
  annotation: ^イ[アンリョ]コーヲ_ア[シタ]ニ#ヒ[カエ]ル$
BASIC5000_4994:
  text: 使っていくうちに、艶が出る。
  annotation: ^ツ[カッテイクウチニ_ツ[ヤガデ]ル$
BASIC5000_4995:
  text: 弾劾裁判がひらかれる。
  annotation: ^ダ[ンガイサ]イバンガ#ヒ[ラカレ]ル$
BASIC5000_4996:
  text: 扇型の、弧の長さを、計算で求める。
  annotation: ^オ[ーギガタノ_コ]ノ#ナ]ガサヲ_ケ[ーサンデ#モ[トメ]ル$
BASIC5000_4997:
  text: その王国は、最後の王に嗣子がおらず、滅亡した。
  annotation: ^ソ[ノ#オ[ーコクワ_サ]イゴノ#オ]ーニ#シ]シガ#オ[ラ]ズ_メ[ツボーシタ$
BASIC5000_4998:
