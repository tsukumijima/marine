  annotation: ^カ[トーセンセ]ーワ_キ]ネン_ア[ナ]タノ#セ[ンセ]ーデシタカ?$
BASIC5000_0690:
  text: 学園祭は、来週行われることになっている。
  annotation: ^ガ[クエンサイワ_ラ[イシューオコナワレルコト]ニ#ナ]ッテイル$
BASIC5000_0691:
  text: 運転するときは、いくら注意してもしすぎることはありません。
  annotation: ^ウ[ンテンスルト]キワ_イ]クラ#チュ]ーイ#シ[テ]モ#シ[スギ]ル#コ[ト]ワ#ア[リマセ]ン$
BASIC5000_0692:
  text: 所もあろうに、モンゴルで偶然、彼女に出会った。
  annotation: ^ト[コロ]モ#ア[ロ]ーニ_モ]ンゴルデ#グ[ーゼン_カ]ノジョニ#デ[ア]ッタ$
BASIC5000_0693:
  text: 晩年になって、そのけちは気前がよくなった。
  annotation: ^バ[ンネンニナ]ッテ_ソ[ノ#ケ]チワ#キ[マエガ#ヨ]ク#ナ]ッタ$
BASIC5000_0694:
